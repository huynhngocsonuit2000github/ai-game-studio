name: Verify and deploy to GitHub Pages

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify portal and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Assemble the full Pages site
        env:
          STUDIO_PAGES_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: pnpm assemble:pages
      - run: pnpm verify:pages
      - name: Smoke-test the assembled site under the Pages project subpath
        env:
          STUDIO_PAGES_BASE_PATH: /ai-game-studio/
          STUDIO_TEST_ASSEMBLED_PAGES: '1'
        run: pnpm exec playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Stamp the verified commit
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: printf '%s\n' "$GITHUB_SHA" > deployment/dist/build-sha.txt
      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: deployment/dist

  deploy:
    name: Deploy verified main to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether this run still represents main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Deploy skipped because main has advanced.'
          fi
      - name: Check Pages configuration
        if: steps.current.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish Pages artifact
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Smoke-test the published revision
        if: steps.current.outputs.deploy == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          url="${PAGE_URL%/}/"
          status="$(curl --fail --silent --show-error --location --max-time 15 --retry 4 --retry-all-errors \
            --output /tmp/studio-pages-index.html --write-out '%{http_code}' "$url")"
          [[ "$status" == '200' ]]
          grep -Fq '<title>Game Library | AI Game Studio</title>' /tmp/studio-pages-index.html
          for attempt in {1..6}; do
            if published_sha="$(curl --fail --silent --show-error --location --max-time 10 "${url}build-sha.txt?sha=${GITHUB_SHA}")" &&
              [[ "$published_sha" == "$GITHUB_SHA" ]]; then
              printf 'Verified %s returned HTTP %s and published commit %s.\n' "$url" "$status" "$published_sha"
              exit 0
            fi
            sleep 5
          done
          echo 'Pages did not return the verified commit SHA.' >&2
          exit 1
