<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c1b">
  <title>Monster Survivor</title>
</head>
<body>
  <main id="game" tabindex="-1" aria-label="Monster Survivor">
    <canvas id="board" width="960" height="540" aria-label="Bellgrave Garden arena"></canvas>
    <div id="hud" hidden></div>
    <div id="touch" hidden>
      <div id="stick" aria-label="Movement joystick"><i></i></div>
      <button id="dash" aria-label="Dash">Dash</button>
    </div>
    <section id="screen"></section>
    <div id="notice" role="status" class="sr"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
